name: Process film media

# Downloads the Process build film from Higgsfield, strips audio, compresses it
# and commits the small copies to public/assets/process/ on the same branch.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch-process-film.sh
      - .github/workflows/process-film.yml

permissions:
  contents: write

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: bash scripts/fetch-process-film.sh
      - name: Commit compressed media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/process src/data/processFilm.ts
          git diff --cached --quiet && exit 0
          git commit -m "Process film: self-hosted compressed media"
          git push
